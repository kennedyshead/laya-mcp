[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-mcp"
version = "0.2.0"
description = "Local MCP routing decisions powered by selectable Laya backends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
mlx = [
  "laya-mlx @ git+https://github.com/mizorewww/laya-mlx.git@0a859518634112655cb97c745dbf04f5191aaf13",
]
torch = ["laya>=0.3.21,<0.4", "torch>=2.0"]
torch-cuda = ["laya>=0.3.21,<0.4", "torch>=2.0"]
onnx = ["laya[onnx]>=0.3.21,<0.4", "torch>=2.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
laya-mcp = "laya_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: runs a real Laya backend and may download a model",
]

[tool.uv]
conflicts = [
  [
    { extra = "torch" },
    { extra = "torch-cuda" },
  ],
  [
    { extra = "onnx" },
    { extra = "torch-cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch" },
  { index = "pytorch-cpu", extra = "onnx" },
  { index = "pytorch-cu130", extra = "torch-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
